buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        // 26: o react-native-nitro-modules so compila o acesso ao HardwareBuffer (Frame.getPixelBuffer
        // da camera) com __ANDROID_API__ >= 26; abaixo disso todo quadro falha com
        // "ArrayBuffer(HardwareBuffer) requires NDK API 26 or above! (minSdk >= 26)"
        minSdkVersion = 26
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
