# Gera o APK do app mobile (app/librese) nos servidores do GitHub.
# Roda em push para qualquer branch app/** (nunca na main, que publica o site no Railway)
# ou manualmente pela aba Actions. O APK fica em "Artifacts" na pagina da execucao.
name: APK Android

on:
  push:
    branches: ['app/**']
    paths:
      - 'app/librese/**'
      - '.github/workflows/apk-android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/librese
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/librese/package-lock.json

      - name: Dependencias do app
        run: npm ci

      # so as arquiteturas de celular de verdade (x86 e para emulador): build bem mais rapido
      - name: Compilar APK (release, assinado com a chave de debug)
        working-directory: app/librese/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: librese-apk-${{ github.sha }}
          path: app/librese/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
